version: 2

project_name: miudb

before:
  hooks:
    - go mod tidy

builds:
  - id: miudb
    main: ./cmd/miudb
    binary: miudb
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/vanducng/miu-db/internal/cli.version={{.Tag}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: "^feat[(\\w)]*!?:"
      order: 0
    - title: Bug Fixes
      regexp: "^fix[(\\w)]*!?:"
      order: 1
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - "^chore:"
      - "^docs:"

release:
  prerelease: auto

brews:
  - name: miudb
    repository:
      owner: vanducng
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/vanducng/miu-db"
    description: "A headless database CLI for humans and agents"
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    install: |
      bin.install "miudb"
    test: |
      output = shell_output("#{bin}/miudb version --output json")
      assert_match "v#{version}", output
