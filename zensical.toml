[project]
site_name = "miu-db"
site_url = "https://miu-db.vanducng.dev/"
site_description = "Headless database CLI for humans and agents."
site_author = "vanducng"
copyright = "© 2026 vanducng. MIT License."
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/miudb.css"]

[project.theme]
variant = "modern"
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand"
]

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.nav]]
Home = "index.md"

[[project.nav]]
"Getting Started" = [
  "go-install.md",
  "go-daily-driver.md"
]

[[project.nav]]
"Agent CLI" = [
  "agent-cli.md",
  "cli-contract.md",
  "mcp.md"
]

[[project.nav]]
Architecture = [
  "system-architecture.md",
  "golang-architecture.md",
  "tech-stack.md",
  "cloud-adapters.md"
]

[[project.nav]]
Operations = [
  "deployment.md",
  "development-guidelines.md",
  "go-release-v0.2.0-go.6.md"
]
