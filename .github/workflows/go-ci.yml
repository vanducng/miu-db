name: go-ci

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
      - run: echo "GOFLAGS=-buildvcs=false" >> "$GITHUB_ENV"
      - run: go test ./...
      - run: go build -o /tmp/miudb ./cmd/miudb
