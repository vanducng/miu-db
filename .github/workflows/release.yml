name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache-dependency-path: go.sum

      - name: Run GoReleaser
        if: ${{ env.HOMEBREW_TAP_GITHUB_TOKEN != '' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser without Homebrew tap
        if: ${{ env.HOMEBREW_TAP_GITHUB_TOKEN == '' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.4
          args: release --clean --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
