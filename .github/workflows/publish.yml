name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. miu-db-v0.1.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Validate release tag
        run: |
          case "${RELEASE_TAG}" in
            miu-db-v*) VERSION="${RELEASE_TAG#miu-db-v}" ;;
            *) echo "::error::Release tag must use miumono component format: miu-db-vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be SemVer: ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Verify built version
        run: |
          test -f "dist/miu_db-${VERSION}.tar.gz"
          test -f "dist/miu_db-${VERSION}-py3-none-any.whl"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
