name: Publish

on:
  push:
    tags:
      - 'miu-db-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. miu-db-v0.1.3"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Validate release tag
        id: version
        run: |
          case "${RELEASE_TAG}" in
            miu-db-v*) VERSION="${RELEASE_TAG#miu-db-v}" ;;
            *) echo "::error::Release tag must use miumono component format: miu-db-vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be SemVer: ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build package
        run: uv build --out-dir dist/

      - name: Verify built version
        run: |
          test -f "dist/miu_db-${{ steps.version.outputs.VERSION }}.tar.gz"
          test -f "dist/miu_db-${{ steps.version.outputs.VERSION }}-py3-none-any.whl"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create or update release
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    name: PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
