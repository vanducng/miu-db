name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Serve the canonical installers and agent skill at the site root (single sources in the repo).
      - name: Stage installers and skill at site root
        run: |
          cp scripts/install.sh docs/public/install.sh
          cp scripts/install.ps1 docs/public/install.ps1
          cp .agents/skills/miudb/SKILL.md docs/public/skill.md
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
